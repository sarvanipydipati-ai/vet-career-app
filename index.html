<script>
const patients = [
  {
    name: 'Bella the Dog',
    emoji: '🐶',
    condition: 'Bella may have an ear infection and low energy.',
    diagnosis: 'Ear Infection',
    correctSteps: ['examine', 'scan', 'medicine'],
    tools: ['Thermometer', 'Otoscope', 'Medicine Tray'],
    fact: 'Vets use otoscopes to inspect ears and detect infections.'
  },
  {
    name: 'Milo the Cat',
    emoji: '🐱',
    condition: 'Milo injured his leg after falling from a shelf.',
    diagnosis: 'Minor Fracture',
    correctSteps: ['examine', 'xray', 'cast'],
    tools: ['X-Ray Scanner', 'Bone Cast Kit'],
    fact: 'Veterinarians use imaging machines to diagnose bone injuries.'
  }
];

let currentPatient = 0;
let score = 0;
let health = 35;
let level = 1;

const timerEl = document.getElementById('timer');
const scoreEl = document.getElementById('score');
const logBox = document.getElementById('logBox');
const healthFill = document.getElementById('healthFill');

function addLog(text) {
  const div = document.createElement('div');
  div.textContent = text;
  logBox.prepend(div);
}

function updateHealth() {
  healthFill.style.width = health + '%';

  if (health <= 0) {
    health = 0;
    addLog("🚨 Patient condition became critical due to incorrect treatment.");
    score = Math.max(0, score - 50);
    scoreEl.textContent = score;
    setTimeout(nextPatient, 1200);
  }
}

function loadPatient() {
  const p = patients[currentPatient];

  document.getElementById('patientName').textContent = p.name;
  document.getElementById('animalEmoji').textContent = p.emoji;
  document.getElementById('conditionText').textContent = p.condition;

  document.getElementById('careerFact').innerHTML =
    `<strong>${p.diagnosis}</strong><br>${p.fact}`;

  health = 35;
  updateHealth();
  addLog("🩺 New patient arrived: " + p.name);
}

function perform(step) {
  const p = patients[currentPatient];
  const expected = p.correctSteps.shift(); // safe progression

  if (step === expected) {
    score += 50;
    health = Math.min(100, health + 20);
    addLog("✅ Correct step: " + step);
  } else {
    health -= 20;
    addLog("❌ Wrong step: " + step);
  }

  scoreEl.textContent = score;
  updateHealth();

  if (p.correctSteps.length === 0) {
    addLog("🎉 Patient treated successfully!");
    setTimeout(nextPatient, 1000);
  }
}

function nextPatient() {
  currentPatient++;
  if (currentPatient >= patients.length) {
    endGame();
  } else {
    loadPatient();
  }
}

function examinePatient(){ perform('examine'); }
function runXray(){ perform('xray'); }
function useScanner(){ perform('scan'); }
function runBloodTest(){ perform('blood'); }
function giveMedicine(){ perform('medicine'); }
function applyCast(){ perform('cast'); }
function performTreatment(){ perform('treatment'); }

function askAssistant(){
  addLog("🧑‍⚕️ Assistant: Follow the correct diagnostic order carefully.");
  score += 10;
  scoreEl.textContent = score;
}

function endGame(){
  document.getElementById('successScreen').style.display = 'flex';
  document.querySelector('#successScreen p').innerHTML =
    `Final Score: <b>${score}</b>`;
}

function restartGame(){
  location.reload();
}

// init
loadPatient();

setInterval(() => {
  let t = parseInt(timerEl.textContent);
  if (t > 0) timerEl.textContent = t - 1;
  else endGame();
}, 1000);

</script>
