<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vet Hero Clinic • Real Vet Work</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
body {
  background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.game-container {
  width: 100%;
  max-width: 1200px;
  background: white;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}
.topbar {
  background: #0f766e;
  color: white;
  padding: 18px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1.1rem;
}
.title { font-size: 2.1rem; font-weight: bold; display: flex; align-items: center; gap: 12px; }

.main {
  display: grid;
  grid-template-columns: 3fr 1fr;
  gap: 24px;
  padding: 24px;
}
.clinic-room {
  background: #f0f9ff;
  border-radius: 20px;
  padding: 24px;
  position: relative;
  min-height: 560px;
}
.patient-card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  text-align: center;
}
.animal-img {
  width: 180px;
  height: 180px;
  object-fit: contain;
  margin: 15px 0;
  transition: transform 0.4s;
}
.heal .animal-img { animation: healAnim 0.8s ease; }
.die .animal-img { animation: dieAnim 1s ease forwards; }

@keyframes healAnim { 0%{transform:scale(1)} 40%{transform:scale(1.15)} 100%{transform:scale(1)} }
@keyframes dieAnim { 0%{transform:translateX(0)} 25%{transform:translateX(-15px)} 50%{transform:translateX(15px)} 100%{transform:translateY(30px) scale(0.8); opacity:0.3; filter:grayscale(1)} }

.health-bar {
  height: 28px;
  background: #e2e8f0;
  border-radius: 999px;
  overflow: hidden;
  margin: 20px 0;
}
.health-fill {
  height: 100%;
  background: linear-gradient(to right, #ef4444, #22c55e);
  width: 60%;
  transition: width 0.4s ease;
}

.actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 20px;
}
button {
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #0ea5e9;
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
button:hover { background: #0284c7; transform: translateY(-2px); }
button.call-assist { background: #8b5cf6; }
button.call-assist:hover { background: #7c3aed; }

.sidebar { display: flex; flex-direction: column; gap: 20px; }
.panel {
  background: #f8fafc;
  padding: 18px;
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.log {
  height: 240px;
  overflow-y: auto;
  background: white;
  padding: 12px;
  border-radius: 12px;
  font-size: 0.95rem;
  line-height: 1.5;
}

/* Overlay */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(15,23,42,0.92);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  padding: 40px;
  border-radius: 20px;
}
.info-box {
  background: rgba(255,255,255,0.15);
  padding: 12px 20px;
  border-radius: 12px;
  margin: 15px 0;
  max-width: 320px;
}
</style>
</head>
<body>

<div class="game-container">
  <div class="topbar">
    <div class="title">🐾 Vet Hero Clinic</div>
    <div>
      ⭐ Score: <span id="score">0</span> &nbsp;&nbsp;
      💀 Deaths: <span id="deaths">0</span>/3 &nbsp;&nbsp;
      🏆 Level: <span id="level">1</span>
    </div>
  </div>

  <div class="main">
    <!-- Main Clinic Area -->
    <div class="clinic-room" id="room">
      <div class="patient-card" id="patientCard">
        <h2 id="patientName"></h2>
        <p id="conditionText" style="color:#64748b; font-weight:500;"></p>
        
        <img id="animalImg" class="animal-img" src="" alt="Patient">

        <div class="health-bar">
          <div class="health-fill" id="healthFill"></div>
        </div>

        <div class="actions" id="actions"></div>
      </div>

      <!-- Game Over / Win Overlay -->
      <div class="overlay" id="overlay">
        <h1 id="overlayTitle"></h1>
        <p id="overlayText"></p>
        <button onclick="restartGame()" style="margin-top:20px; padding:14px 32px; font-size:1.1rem;">Play Again</button>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="panel">
        <h3>👩‍⚕️ Your Assistant: Mia</h3>
        <p style="font-size:0.9rem; margin-bottom:12px;">Call Mia for help with complex tasks. Teamwork makes the clinic better!</p>
        <button class="call-assist" onclick="callAssistant()">Call Assistant</button>
      </div>

      <div class="panel">
        <h3>📋 Activity Log</h3>
        <div class="log" id="logBox"></div>
      </div>

      <div class="panel">
        <h3>💡 Vet Tip</h3>
        <p id="vetTip" style="font-size:0.95rem; line-height:1.5;"></p>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== DATA ====================
const animalImages = {
  dog: "https://picsum.photos/id/1015/300/300",   // replace with your own later
  cat: "https://picsum.photos/id/201/300/300",
  rabbit: "https://picsum.photos/id/251/300/300",
  bird: "https://picsum.photos/id/180/300/300",
  turtle: "https://picsum.photos/id/866/300/300"
};

let currentPatient = null;
let score = 0;
let deaths = 0;
const maxDeaths = 3;
let level = 1;
let health = 100;
let stepIndex = 0;
let assistantUsed = false;

const healthFill = document.getElementById("healthFill");
const logBox = document.getElementById("logBox");

const possiblePatients = [
  { name: "Bella the Golden Retriever", type: "dog", condition: "Severe ear infection", image: animalImages.dog,
    steps: ["examine", "otoscopy", "medicine", "followup"] },
  { name: "Milo the Siamese Cat", type: "cat", condition: "Fractured leg", image: animalImages.cat,
    steps: ["examine", "xray", "painkillers", "cast"] },
  { name: "Luna the Holland Lop", type: "rabbit", condition: "GI Stasis", image: animalImages.rabbit,
    steps: ["examine", "palpation", "fluids", "medicine"] },
  { name: "Rio the Parrot", type: "bird", condition: "Respiratory infection", image: animalImages.bird,
    steps: ["examine", "bloodtest", "antibiotics"] }
];

// ==================== CORE FUNCTIONS ====================
function getRandomPatient() {
  return {...possiblePatients[Math.floor(Math.random() * possiblePatients.length)]};
}

function increaseDifficulty() {
  level = Math.floor(score / 350) + 1;
  document.getElementById("level").textContent = level;
}

function loadNewPatient() {
  currentPatient = getRandomPatient();
  stepIndex = 0;
  health = 85 - (level * 5); // harder at higher levels
  assistantUsed = false;

  document.getElementById("patientName").textContent = currentPatient.name;
  document.getElementById("conditionText").textContent = currentPatient.condition;
  document.getElementById("animalImg").src = currentPatient.image;

  renderActionButtons();
  updateHealth();
  addLog(`New patient arrived: ${currentPatient.name}`);
  updateVetTip();
}

function updateHealth() {
  if (health <= 0) {
    health = 0;
    document.getElementById("patientCard").classList.add("die");
    setTimeout(failPatient, 900);
    return;
  }
  healthFill.style.width = `${health}%`;
}

function failPatient() {
  deaths++;
  score = Math.max(0, score - 120);
  addLog("💀 Patient could not be saved");
  updateUI();

  if (deaths >= maxDeaths) {
    showOverlay("Game Over", `You lost 3 patients.<br>Final Score: ${score}<br>Keep learning — real vets save lives through science and teamwork!`);
  } else {
    setTimeout(loadNewPatient, 1200);
  }
}

function perform(action) {
  const expected = currentPatient.steps[stepIndex];
  
  if (action === expected) {
    addLog(`✅ Correct: ${action.toUpperCase()}`);
    health = Math.min(100, health + 22);
    score += 45 + (level * 8);
    document.getElementById("patientCard").classList.add("heal");
    setTimeout(() => document.getElementById("patientCard").classList.remove("heal"), 800);
    stepIndex++;
  } else {
    addLog(`❌ Wrong step for this condition`);
    health -= 18;
  }

  updateUI();
  updateHealth();

  if (stepIndex >= currentPatient.steps.length) {
    addLog("🎉 Patient successfully treated!");
    score += 150;
    setTimeout(loadNewPatient, 800);
  }
}

function callAssistant() {
  if (assistantUsed) {
    addLog("Mia is already helping with another task.");
    return;
  }
  assistantUsed = true;
  addLog("Mia joined! She performed one complex step for you.");
  health = Math.min(100, health + 28);
  score += 30;
  updateHealth();
  updateUI();
}

// ==================== UI HELPERS ====================
function renderActionButtons() {
  const container = document.getElementById("actions");
  container.innerHTML = "";

  const actions = ["examine", "xray", "otoscopy", "palpation", "bloodtest", "medicine", "painkillers", "fluids", "cast"];
  const labels = {
    examine: "Physical Exam", xray: "Take X-Ray", otoscopy: "Ear Scope",
    palpation: "Abdominal Palpation", bloodtest: "Blood Test",
    medicine: "Prescribe Medicine", painkillers: "Give Pain Relief",
    fluids: "IV Fluids", cast: "Apply Cast"
  };

  actions.forEach(act => {
    const btn = document.createElement("button");
    btn.textContent = labels[act] || act;
    btn.onclick = () => perform(act);
    container.appendChild(btn);
  });
}

function updateUI() {
  document.getElementById("score").textContent = score;
  document.getElementById("deaths").textContent = deaths;
  increaseDifficulty();
}

function addLog(text) {
  const div = document.createElement("div");
  div.textContent = text;
  logBox.prepend(div);
  if (logBox.children.length > 12) logBox.removeChild(logBox.lastChild);
}

function updateVetTip() {
  const tips = [
    "Listening to the heart and lungs is one of the most important parts of every exam.",
    "X-rays help us see inside bones and organs without surgery.",
    "Teamwork between vets and assistants saves more lives.",
    "Medicine must be dosed carefully based on the animal’s weight."
  ];
  document.getElementById("vetTip").textContent = tips[Math.floor(Math.random()*tips.length)];
}

function showOverlay(title, message) {
  document.getElementById("overlayTitle").innerHTML = title;
  document.getElementById("overlayText").innerHTML = message;
  document.getElementById("overlay").style.display = "flex";
}

function restartGame() {
  score = 0;
  deaths = 0;
  level = 1;
  document.getElementById("overlay").style.display = "none";
  logBox.innerHTML = "";
  loadNewPatient();
  updateUI();
}

// Start the game
loadNewPatient();
updateUI();
</script>
</body>
</html>
