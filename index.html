<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Clinic Pro</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #game-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; width: 350px; }
        .hidden { display: none; }
        button { padding: 12px 25px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; background: #3498db; color: white; font-weight: bold; }
        button:hover { background: #2980b9; }
        #pet { font-size: 80px; margin: 20px 0; }
        .stats { font-size: 1.2rem; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <h1>Vet Clinic Pro</h1>
        <p>Keep the pets healthy! If health hits 0%, it's game over.</p>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="stats">Health: <span id="health">100</span>% | Score: <span id="score">0</span></div>
        <div id="pet">🐶</div>
        <button onclick="action('examine')">Examine</button>
        <button onclick="action('treat')">Treat</button>
        <p id="msg">A patient needs help!</p>
    </div>
</div>

<script>
    let health = 100;
    let score = 0;
    let gameActive = false;
    const pets = ['🐶', '🐱', '🐹', '🐰', '🦜'];

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        gameActive = true;
        gameLoop();
    }

    function action(type) {
        if (!gameActive) return;
        if (type === 'examine') {
            score += 10;
            document.getElementById('msg').innerText = "Good diagnostic!";
        } else {
            score += 20;
            document.getElementById('msg').innerText = "Excellent treatment!";
        }
        updateDisplay();
    }

    function gameLoop() {
        if (!gameActive) return;
        health -= 5;
        if (health <= 0) {
            gameActive = false;
            alert("Game Over! Final Score: " + score);
            location.reload();
        }
        document.getElementById('pet').innerText = pets[Math.floor(Math.random() * pets.length)];
        updateDisplay();
        setTimeout(gameLoop, 2000);
    }

    function updateDisplay() {
        document.getElementById('health').innerText = health;
        document.getElementById('score').innerText = score;
    }
</script>
</body>
</html>
