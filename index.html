<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vet Hero Clinic</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #dff4ff, #f4fbff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 1100px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .topbar {
      background: #0f766e;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
    }

    .title {
      font-size: 2rem;
      font-weight: bold;
    }

    .main {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      padding: 20px;
    }

    .clinic-room {
      background: #eef9ff;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      min-height: 500px;
    }

    .patient-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .animal {
      font-size: 5rem;
      text-align: center;
      margin: 10px 0;
    }

    .health-bar {
      width: 100%;
      height: 25px;
      background: #ddd;
      border-radius: 12px;
      overflow: hidden;
      margin: 10px 0;
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(to right, red, green);
      width: 60%;
      transition: width 0.3s;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #0ea5e9;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0284c7;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .panel {
      background: #f8fafc;
      padding: 15px;
      border-radius: 15px;
    }

    .log {
      height: 200px;
      overflow-y: auto;
      background: white;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    /* OVERLAY */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 20px;
    }

    .restart-btn {
      margin-top: 20px;
      background: #22c55e;
    }

    /* 🐾 RECOVERY ANIMATION */
    .recover {
      animation: recoverAnim 0.8s ease;
    }

    @keyframes recoverAnim {
      0% { transform: scale(1); }
      30% { transform: scale(1.2); filter: drop-shadow(0 0 10px #22c55e); }
      100% { transform: scale(1); }
    }

    /* 💀 DEATH ANIMATION */
    .die {
      animation: dieAnim 1s ease forwards;
    }

    @keyframes dieAnim {
      0% { transform: translateX(0); opacity: 1; }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateY(20px); opacity: 0; filter: grayscale(1); }
    }

    /* red flash */
    .flash {
      animation: flash 0.5s ease;
    }

    @keyframes flash {
      0% { background: #eef9ff; }
      50% { background: #fecaca; }
      100% { background: #eef9ff; }
    }

  </style>
</head>

<body>

<div class="game-container">

  <div class="topbar">
    <div class="title">🐾 Vet Hero Clinic</div>
    <div>⭐ Score: <span id="score">0</span> | 💀 Deaths: <span id="deaths">0</span>/3</div>
  </div>

  <div class="main">

    <div class="clinic-room" id="room">

      <div class="patient-card">
        <h2 id="patientName"></h2>
        <p id="conditionText"></p>

        <div class="animal" id="animalEmoji"></div>

        <div class="health-bar">
          <div class="health-fill" id="healthFill"></div>
        </div>

        <div class="actions"></div>
      </div>

      <div class="overlay" id="overlay">
        <h1 id="overlayTitle"></h1>
        <p id="overlayText"></p>
        <button class="restart-btn" onclick="restartGame()">Restart</button>
      </div>

    </div>

    <div class="sidebar">

      <div class="panel">
        <h3>📋 Log</h3>
        <div class="log" id="logBox"></div>
      </div>

    </div>

  </div>
</div>

<script>

const patients = [
  { name:"Bella the Dog", emoji:"🐶", condition:"Ear infection", steps:["examine","medicine"] },
  { name:"Milo the Cat", emoji:"🐱", condition:"Broken leg", steps:["examine","xray","cast"] },
  { name:"Luna the Rabbit", emoji:"🐰", condition:"Digestive issue", steps:["examine","medicine"] }
];

let currentPatient = 0;
let score = 0;
let health = 60;
let stepIndex = 0;

let deaths = 0;
const maxDeaths = 3;

const healthFill = document.getElementById("healthFill");
const logBox = document.getElementById("logBox");

function loadPatient(){
  const p = patients[currentPatient];
  stepIndex = 0;
  health = 60;

  document.getElementById("patientName").textContent = p.name;
  document.getElementById("animalEmoji").textContent = p.emoji;
  document.getElementById("conditionText").textContent = p.condition;

  renderButtons();
  updateHealth();
  addLog("New patient: " + p.name);
}

function animateAnimal(type){
  const animal = document.getElementById("animalEmoji");
  animal.classList.remove("recover","die");

  if(type === "recover") animal.classList.add("recover");

  if(type === "die") animal.classList.add("die");

  setTimeout(() => {
    animal.classList.remove("recover","die");
  }, 1000);
}

function updateHealth(){
  if(health <= 0){
    health = 0;
    healthFill.style.width = "0%";

    animateAnimal("die");
    document.getElementById("room").classList.add("flash");

    setTimeout(() => failPatient(), 800);
    return;
  }

  healthFill.style.width = health + "%";
}

function failPatient(){
  addLog("💀 Patient died");

  score -= 100;
  if(score < 0) score = 0;

  deaths++;
  document.getElementById("score").textContent = score;

  document.getElementById("deaths").textContent = deaths;

  if(deaths >= maxDeaths){
    showGameOver("Too many patients were lost in your clinic.");
    return;
  }

  nextPatient();
}

function showGameOver(msg){
  document.getElementById("overlay").style.display = "flex";
  document.getElementById("overlayTitle").textContent = "GAME OVER";
  document.getElementById("overlayText").textContent =
    msg + " Final Score: " + score;
}

function nextPatient(){
  currentPatient++;

  if(currentPatient >= patients.length){
    showGameOver("All patients completed!");
  } else {
    loadPatient();
  }
}

function perform(action){
  const p = patients[currentPatient];
  const expected = p.steps[stepIndex];

  if(action === expected){
    addLog("✔ Correct: " + action);
    stepIndex++;
    health += 25;
    score += 50;

    animateAnimal("recover");
  } else {
    addLog("❌ Wrong step");
    health -= 20;
  }

  document.getElementById("score").textContent = score;
  updateHealth();

  if(stepIndex >= p.steps.length){
    addLog("✅ Patient healed");
    score += 100;
    nextPatient();
  }
}

function addLog(text){
  const div = document.createElement("div");
  div.textContent = text;
  logBox.prepend(div);
}

function renderButtons(){
  document.querySelector(".actions").innerHTML = `
    <button onclick="perform('examine')">Examine</button>
    <button onclick="perform('xray')">X-Ray</button>
    <button onclick="perform('medicine')">Medicine</button>
    <button onclick="perform('cast')">Cast</button>
  `;
}

function restartGame(){
  currentPatient = 0;
  score = 0;
  deaths = 0;
  health = 60;
  stepIndex = 0;

  document.getElementById("overlay").style.display = "none";
  document.getElementById("score").textContent = score;
  document.getElementById("deaths").textContent = deaths;
  logBox.innerHTML = "";

  loadPatient();
}

loadPatient();

</script>

</body>
</html>
