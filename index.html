<script>
  const patients = [ /* SAME ARRAY AS YOUR ORIGINAL — unchanged */ 
    // (keep your full patient list here exactly as you had it)
  ];

  let currentPatient = 0;
  let score = 0;
  let reputation = 100;
  let health = 35;
  let timeLeft = 180;
  let completedSteps = [];
  let level = 1;

  const timerEl = document.getElementById('timer');
  const scoreEl = document.getElementById('score');
  const logBox = document.getElementById('logBox');
  const healthFill = document.getElementById('healthFill');

  function updateLevel() {
    let newLevel = 1;

    if (score >= 700) newLevel = 3;
    else if (score >= 300) newLevel = 2;

    if (newLevel !== level) {
      level = newLevel;
      addLog(`🏆 Level Up! You reached Level ${level} Vet Status!`);
    }
  }

  function checkHealthFailure() {
    if (health <= 0) {
      health = 0;
      updateHealth();

      addLog("🚨 Oh no! The patient's condition became critical due to incorrect treatment timing.");
      addLog("📉 Score penalty applied for failed stabilization.");

      score -= 50;
      if (score < 0) score = 0;
      scoreEl.textContent = score;

      setTimeout(() => {
        nextPatient();
      }, 1500);

      return true;
    }
    return false;
  }

  function loadPatient() {
    const patient = patients[currentPatient];

    document.getElementById('patientName').textContent = patient.name;
    document.getElementById('animalEmoji').textContent = patient.emoji;
    document.getElementById('conditionText').textContent = patient.condition;

    document.getElementById('careerFact').innerHTML = `
      <strong>Diagnosis Goal:</strong> ${patient.diagnosis}<br><br>
      <strong>Medical Tools:</strong> ${patient.tools.join(', ')}<br><br>
      ${patient.fact}
      <br><br>
      <strong>Current Level:</strong> ${level}
    `;

    completedSteps = [];
    health = 35;
    updateHealth();

    addLog(`🚑 ${patient.name} checked into the clinic.`);
    addLog(`📋 New case started.`);
  }

  function updateHealth() {
    healthFill.style.width = health + '%';
  }

  function addLog(text) {
    const entry = document.createElement('div');
    entry.innerHTML = text;
    logBox.prepend(entry);
  }

  function performStep(step, successText, failText) {
    const patient = patients[currentPatient];
    const expectedStep = patient.correctSteps[completedSteps.length];

    if (step === expectedStep) {
      completedSteps.push(step);

      health += 20;
      if (health > 100) health = 100;

      updateHealth();
      addLog(`✅ ${successText}`);

      score += 50;
      scoreEl.textContent = score;

      updateLevel();

      if (completedSteps.length === patient.correctSteps.length) {
        addLog("🎉 Patient stabilized successfully!");
        setTimeout(nextPatient, 1200);
      }

    } else {
      health -= 20;
      reputation -= 10;

      updateHealth();

      addLog(`❌ ${failText}`);
      addLog(`⚠️ Incorrect procedure order affects diagnosis accuracy.`);

      if (checkHealthFailure()) return;
    }

    if (checkHealthFailure()) return;
  }

  function nextPatient() {
    currentPatient++;

    if (currentPatient >= patients.length) {
      endGame();
    } else {
      loadPatient();
    }
  }

  function examinePatient() {
    performStep('examine',
      'Vitals checked and symptoms recorded.',
      'You skipped initial examination.'
    );
  }

  function runXray() {
    performStep('xray',
      'X-ray scan completed successfully.',
      'X-ray was not needed yet.'
    );
  }

  function runBloodTest() {
    performStep('blood',
      'Blood sample analyzed.',
      'Blood test was premature.'
    );
  }

  function useScanner() {
    performStep('scan',
      'Digital scan revealed internal issues.',
      'Scan used at wrong time.'
    );
  }

  function giveMedicine() {
    performStep('medicine',
      'Medication administered safely.',
      'Medication was not appropriate yet.'
    );
  }

  function applyCast() {
    performStep('cast',
      'Injury stabilized with cast.',
      'Cast applied too early.'
    );
  }

  function performTreatment() {
    performStep('treatment',
      'Supportive treatment improved condition.',
      'Treatment applied incorrectly.'
    );
  }

  function askAssistant() {
    const patient = patients[currentPatient];
    const nextStep = patient.correctSteps[completedSteps.length];

    const hints = {
      examine: 'Start with examination and vitals.',
      xray: 'Imaging may help diagnose bone issues.',
      blood: 'Lab tests can confirm internal conditions.',
      scan: 'Use diagnostic scanning tools.',
      medicine: 'Medication may be required now.',
      cast: 'Stabilization may be needed.',
      treatment: 'Supportive treatment is next.'
    };

    document.getElementById('assistantFact').textContent = hints[nextStep];
    addLog('🧑‍⚕️ Assistant provided guidance.');
    score += 10;
    scoreEl.textContent = score;
    updateLevel();
  }

  function endGame() {
    document.getElementById('successScreen').style.display = 'flex';

    document.querySelector('#successScreen p').innerHTML = `
      Final Score: <strong>${score}</strong><br><br>
      Final Level: <strong>${level}</strong><br><br>
      You completed your vet clinic shift using medical science, teamwork, and diagnostics.
    `;
  }

  function restartGame() {
    currentPatient = 0;
    score = 0;
    reputation = 100;
    timeLeft = 180;
    level = 1;

    scoreEl.textContent = score;
    timerEl.textContent = timeLeft;
    logBox.innerHTML = '';

    document.getElementById('successScreen').style.display = 'none';

    loadPatient();
  }

  setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;

    if (timeLeft <= 0) endGame();
  }, 1000);

  loadPatient();
</script>
