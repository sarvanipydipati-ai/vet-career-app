<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vet Hero Clinic</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial;
}

body{
  background:linear-gradient(to bottom right,#dff4ff,#f4fbff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.game-container{
  width:100%;
  max-width:1100px;
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.topbar{
  background:#0f766e;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
}

.main{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  padding:20px;
}

.clinic-room{
  background:#eef9ff;
  border-radius:20px;
  padding:20px;
  min-height:500px;
}

.patient-card{
  background:white;
  padding:20px;
  border-radius:15px;
}

.animal-box{
  text-align:center;
  margin:15px 0;
  padding:20px;
  border-radius:15px;
  background:#f8fafc;
  font-size:1.2rem;
  font-weight:bold;
  transition:0.3s;
}

.health-bar{
  width:100%;
  height:25px;
  background:#ddd;
  border-radius:12px;
  overflow:hidden;
}

.health-fill{
  height:100%;
  width:60%;
  background:linear-gradient(to right,red,green);
  transition:0.3s;
}

.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:#0ea5e9;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{ background:#0284c7; }

.sidebar{ display:flex; flex-direction:column; gap:15px; }

.panel{
  background:#f8fafc;
  padding:15px;
  border-radius:15px;
}

.log{
  height:200px;
  overflow-y:auto;
  background:white;
  padding:10px;
  border-radius:10px;
  font-size:0.9rem;
}

/* 🟢 heal animation */
.heal{
  animation:heal 0.6s ease;
}
@keyframes heal{
  0%{transform:scale(1)}
  50%{transform:scale(1.2); box-shadow:0 0 15px #22c55e;}
  100%{transform:scale(1)}
}

/* 💀 death animation */
.die{
  animation:die 1s ease forwards;
}
@keyframes die{
  0%{transform:translateX(0);opacity:1}
  25%{transform:translateX(-10px)}
  50%{transform:translateX(10px)}
  100%{transform:translateY(20px);opacity:0;filter:grayscale(1)}
}

</style>
</head>

<body>

<div class="game-container">

  <div class="topbar">
    <div>Veterinary Emergency Clinic</div>
    <div>
      Score: <span id="score">0</span> |
      Deaths: <span id="deaths">0</span> |
      Level: <span id="level">1</span>
    </div>
  </div>

  <div class="main">

    <div class="clinic-room">

      <div class="patient-card">

        <h2 id="name"></h2>
        <p id="condition"></p>

        <div class="animal-box" id="animalBox"></div>

        <div class="health-bar">
          <div class="health-fill" id="health"></div>
        </div>

        <div class="actions" id="actions"></div>

      </div>

    </div>

    <div class="sidebar">

      <div class="panel">
        <h3>Medical Log</h3>
        <div class="log" id="log"></div>
      </div>

    </div>

  </div>
</div>

<script>

/* 🧬 REALISTIC ANIMALS (NO EMOJIS) */
const animals = [
  {type:"Dog", breeds:["Labrador","German Shepherd","Beagle","Husky"]},
  {type:"Cat", breeds:["Siamese","Persian","Tabby","Maine Coon"]},
  {type:"Rabbit", breeds:["Dutch Rabbit","Angora","Lionhead"]},
  {type:"Fox", breeds:["Arctic Fox","Red Fox"]},
  {type:"Bird", breeds:["Parrot","Eagle","Owl"]},
  {type:"Horse", breeds:["Arabian Horse","Mustang"]},
  {type:"Reptile", breeds:["Iguana","Gecko","Snake"]},
  {type:"Hamster", breeds:["Syrian Hamster","Dwarf Hamster"]}
];

/* 🦠 DISEASE SYSTEM */
const illnesses = [
  {name:"Infection", steps:["examine","medicine"]},
  {name:"Fracture", steps:["examine","xray","cast"]},
  {name:"Digestive Disorder", steps:["examine","medicine"]},
  {name:"Respiratory Issue", steps:["examine","scan","medicine"]},
  {name:"Nutritional Deficiency", steps:["examine","blood","medicine"]},
];

let patient = {};
let step = 0;

let score = 0;
let deaths = 0;
let level = 1;
let health = 60;

const maxDeaths = 3;

/* 🐾 GENERATE RANDOM PATIENT */
function newPatient(){

  const a = animals[Math.floor(Math.random()*animals.length)];
  const breed = a.breeds[Math.floor(Math.random()*a.breeds.length)];
  const illness = illnesses[Math.floor(Math.random()*illnesses.length)];

  patient = {
    animal: a.type,
    breed: breed,
    illness: illness.name,
    steps: illness.steps
  };

  step = 0;
  health = 60;

  document.getElementById("name").textContent =
    patient.breed + " (" + patient.animal + ")";

  document.getElementById("condition").textContent =
    "Suspected condition: " + patient.illness;

  renderButtons();
  updateHealth();
  log("New patient: " + patient.breed);
}

/* 📈 LEVEL SYSTEM */
function updateLevel(){
  const newLevel = Math.floor(score / 300) + 1;
  level = newLevel;
  document.getElementById("level").textContent = level;
}

/* 🟢 + 💀 ANIMATIONS */
function animate(type){
  const box = document.getElementById("animalBox");
  box.classList.remove("heal","die");

  if(type==="heal") box.classList.add("heal");
  if(type==="die") box.classList.add("die");

  setTimeout(()=>box.classList.remove("heal","die"),700);
}

/* ❤️ HEALTH */
function updateHealth(){
  if(health <= 0){
    health = 0;
    document.getElementById("health").style.width = "0%";

    animate("die");
    setTimeout(()=>fail(),700);
    return;
  }

  document.getElementById("health").style.width = health + "%";
}

/* 💀 FAILURE */
function fail(){

  deaths++;
  score = Math.max(0, score - 100);

  updateUI();
  log("Patient died");

  if(deaths >= maxDeaths){
    alert("GAME OVER — Clinic failed");
    location.reload();
    return;
  }

  newPatient();
}

/* 🎯 ACTIONS */
function act(type){

  const expected = patient.steps[step];

  if(type === expected){
    step++;
    health += 25;
    score += 50;
    animate("heal");
    log("Correct: " + type);
  } else {
    health -= 20;
    log("Wrong procedure");
  }

  updateUI();
  updateHealth();

  if(step >= patient.steps.length){
    score += 100;
    log("Patient cured");
    newPatient();
  }
}

/* 🧰 BUTTONS SCALE WITH LEVEL */
function renderButtons(){

  let list = ["examine","medicine"];

  if(level >= 2) list.push("xray");
  if(level >= 3) list.push("scan");
  if(level >= 4) list.push("blood","cast");

  document.getElementById("actions").innerHTML =
    list.map(b => `<button onclick="act('${b}')">${b}</button>`).join("");
}

/* 📊 UI */
function updateUI(){
  document.getElementById("score").textContent = score;
  document.getElementById("deaths").textContent = deaths;
  updateLevel();
}

/* 📝 LOG */
function log(t){
  const d = document.createElement("div");
  d.textContent = t;
  document.getElementById("log").prepend(d);
}

/* START */
newPatient();
updateUI();

</script>

</body>
</html>
