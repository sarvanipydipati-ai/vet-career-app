<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Hero Game</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #e8f5e9; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .btn { margin: 10px; padding: 15px 25px; font-size: 18px; cursor: pointer; background: #2e7d32; color: white; border: none; border-radius: 10px; }
        #pet-icon { font-size: 80px; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🐾 Vet Hero</h1>
        <div id="pet-icon">🐶</div>
        <p>Pet Health: <span id="health">50</span>%</p>
        
        <button class="btn" onclick="treat('examine')">Use Stethoscope</button>
        <button class="btn" onclick="treat('medicine')">Give Medicine</button>
        
        <p id="feedback">The puppy feels sick. Help him!</p>
    </div>

    <script>
        let health = 50;
        function treat(action) {
            if (action === 'examine') {
                health += 20;
                document.getElementById('feedback').innerHTML = "Good science! You checked his lungs.";
            } else {
                health += 30;
                document.getElementById('feedback').innerHTML = "Great job! He's feeling much better.";
            }
            document.getElementById('health').innerHTML = health;
            if (health >= 100) {
                document.getElementById('feedback').innerHTML = "🎉 You saved the puppy! You're a hero!";
                document.getElementById('pet-icon').innerHTML = "🐕";
            }
        }
    </script>
</body>
</html>
