<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vet Hero Clinic 🐾</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
body {
  background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.game-container {
  width: 100%;
  max-width: 1150px;
  background: white;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}
.topbar {
  background: #0f766e;
  color: white;
  padding: 18px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1.15rem;
}
.title { font-size: 2.2rem; font-weight: bold; }

.main {
  display: grid;
  grid-template-columns: 3fr 1fr;
  gap: 24px;
  padding: 24px;
}
.clinic-room {
  background: #f0f9ff;
  border-radius: 20px;
  padding: 24px;
  position: relative;
  min-height: 560px;
}
.patient-card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  text-align: center;
}
.animal {
  font-size: 9.5rem;
  margin: 10px 0 15px;
  transition: all 0.4s;
}
.heal .animal { animation: healAnim 0.8s ease; }
.die .animal { animation: dieAnim 1s ease forwards; }

@keyframes healAnim { 0%{transform:scale(1)} 40%{transform:scale(1.2)} 100%{transform:scale(1)} }
@keyframes dieAnim { 0%{transform:translateX(0)} 25%{transform:translateX(-20px)} 50%{transform:translateX(20px)} 100%{transform:translateY(40px) scale(0.7); opacity:0.4;} }

.health-bar {
  height: 30px;
  background: #e2e8f0;
  border-radius: 999px;
  overflow: hidden;
  margin: 20px 0;
}
.health-fill {
  height: 100%;
  background: linear-gradient(to right, #ef4444, #22c55e);
  width: 65%;
  transition: width 0.4s;
}

.actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 20px;
}
button {
  padding: 16px 10px;
  border: none;
  border-radius: 12px;
  background: #0ea5e9;
  color: white;
  font-weight: 600;
  cursor: pointer;
  font-size: 1.05rem;
}
button:hover { background: #0284c7; transform: translateY(-2px); }

.explain {
  font-size: 0.9rem;
  color: #64748b;
  margin-top: 6px;
  min-height: 42px;
}

.sidebar { display: flex; flex-direction: column; gap: 20px; }
.panel {
  background: #f8fafc;
  padding: 18px;
  border-radius: 16px;
}
.log {
  height: 220px;
  overflow-y: auto;
  background: white;
  padding: 12px;
  border-radius: 12px;
  font-size: 0.95rem;
}
</style>
</head>
<body>

<div class="game-container">
  <div class="topbar">
    <div class="title">🐾 Vet Hero Clinic</div>
    <div>
      ⭐ Score: <span id="score">0</span> &nbsp;&nbsp;
      💀 Deaths: <span id="deaths">0</span>/3 &nbsp;&nbsp;
      🏆 Level: <span id="level">1</span>
    </div>
  </div>

  <div class="main">
    <div class="clinic-room">
      <div class="patient-card" id="patientCard">
        <h2 id="patientName"></h2>
        <p id="conditionText" style="color:#475569; font-size:1.1rem;"></p>
        
        <div class="animal" id="animalEmoji"></div>

        <div class="health-bar">
          <div class="health-fill" id="healthFill"></div>
        </div>

        <div class="actions" id="actions"></div>
      </div>

      <div class="overlay" id="overlay" style="display:none; position:absolute; inset:0; background:rgba(15,23,42,0.92); color:white; justify-content:center; align-items:center; flex-direction:column; text-align:center; padding:40px; border-radius:20px;">
        <h1 id="overlayTitle"></h1>
        <p id="overlayText"></p>
        <button onclick="restartGame()" style="margin-top:25px; padding:14px 40px; font-size:1.2rem; border-radius:12px;">Play Again</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <h3>👩‍⚕️ Assistant Mia</h3>
        <p>Mia helps when things are hard. Real vets work as a team!</p>
        <button onclick="callAssistant()" style="margin-top:10px; background:#8b5cf6; width:100%;">Call Mia for Help</button>
      </div>

      <div class="panel">
        <h3>📋 Activity Log</h3>
        <div class="log" id="logBox"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Game Data
const patientsPool = [
  { name: "Bella the Dog", emoji: "🐶", condition: "Ear Infection" },
  { name: "Milo the Cat", emoji: "🐱", condition: "Broken Leg" },
  { name: "Luna the Rabbit", emoji: "🐰", condition: "Tummy Problem" },
  { name: "Rio the Bird", emoji: "🐦", condition: "Breathing Trouble" }
];

let currentPatient, score = 0, deaths = 0, level = 1, health = 100, stepIndex = 0, assistantUsed = false;

const healthFill = document.getElementById("healthFill");
const logBox = document.getElementById("logBox");

const actionList = [
  { id: "examine", name: "Examine", desc: "Check eyes, ears & heart" },
  { id: "xray", name: "X-Ray", desc: "Take picture of bones" },
  { id: "medicine", name: "Give Medicine", desc: "Give the right medicine" },
  { id: "painkillers", name: "Pain Relief", desc: "Help stop the pain" },
  { id: "cast", name: "Put Cast", desc: "Fix broken bones" }
];

function loadNewPatient() {
  currentPatient = patientsPool[Math.floor(Math.random() * patientsPool.length)];
  stepIndex = 0;
  health = Math.max(65, 95 - (level * 6));
  assistantUsed = false;

  document.getElementById("patientName").textContent = currentPatient.name;
  document.getElementById("animalEmoji").textContent = currentPatient.emoji;
  document.getElementById("conditionText").textContent = currentPatient.condition;

  renderButtons();
  updateHealth();
  addLog(`🆕 New patient: ${currentPatient.name}`);
}

function updateHealth() {
  if (health <= 0) {
    document.getElementById("patientCard").classList.add("die");
    setTimeout(failPatient, 900);
    return;
  }
  healthFill.style.width = health + "%";
}

function failPatient() {
  deaths++;
  score = Math.max(0, score - 100);
  addLog("💀 Patient died... Try again!");
  updateUI();

  if (deaths >= 3) {
    showOverlay("Game Over", `You lost 3 patients.<br>Final Score: ${score}`);
  } else {
    setTimeout(loadNewPatient, 1000);
  }
}

function perform(actionId) {
  const isCorrect = true;   // All buttons are useful now - simpler for kids

  if (isCorrect) {
    const action = actionList.find(a => a.id === actionId);
    addLog(`✅ Good job! ${action.name}`);
    health = Math.min(100, health + 25);
    score += 55 + (level * 10);
    
    document.getElementById("patientCard").classList.add("heal");
    setTimeout(() => document.getElementById("patientCard").classList.remove("heal"), 700);
    
    stepIndex++;
  } else {
    health -= 22;
  }

  updateHealth();
  updateUI();

  if (stepIndex >= 4) {
    addLog("🎉 Patient is healthy again! You're a great vet!");
    score += 160;
    setTimeout(loadNewPatient, 900);
  }
}

function callAssistant() {
  if (assistantUsed) return;
  assistantUsed = true;
  addLog("👩‍⚕️ Mia helped! Great teamwork!");
  health = Math.min(100, health + 32);
  score += 45;
  updateHealth();
  updateUI();
}

function renderButtons() {
  const container = document.getElementById("actions");
  container.innerHTML = "";

  actionList.forEach(action => {
    const btn = document.createElement("button");
    btn.innerHTML = `${action.name}<div class="explain">${action.desc}</div>`;
    btn.onclick = () => perform(action.id);
    container.appendChild(btn);
  });
}

function updateUI() {
  document.getElementById("score").textContent = score;
  document.getElementById("deaths").textContent = deaths;
  level = Math.floor(score / 400) + 1;
  document.getElementById("level").textContent = level;
}

function addLog(text) {
  const div = document.createElement("div");
  div.textContent = text;
  logBox.prepend(div);
  if (logBox.children.length > 10) logBox.removeChild(logBox.lastChild);
}

function showOverlay(title, message) {
  document.getElementById("overlayTitle").innerHTML = title;
  document.getElementById("overlayText").innerHTML = message;
  document.getElementById("overlay").style.display = "flex";
}

function restartGame() {
  score = 0; deaths = 0; level = 1;
  document.getElementById("overlay").style.display = "none";
  logBox.innerHTML = "";
  loadNewPatient();
  updateUI();
}

// Start the game
loadNewPatient();
updateUI();
</script>
</body>
</html>
