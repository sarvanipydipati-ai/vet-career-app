<script>

const patients = [
  { name:"Bella the Dog", emoji:"🐶", condition:"Ear infection", steps:["examine","medicine"] },
  { name:"Milo the Cat", emoji:"🐱", condition:"Broken leg", steps:["examine","xray","cast"] },
  { name:"Luna the Rabbit", emoji:"🐰", condition:"Digestive issue", steps:["examine","medicine"] },
  { name:"Rocky the Fox", emoji:"🦊", condition:"Infection", steps:["examine","medicine","cast"] }
];

let currentPatient = 0;
let score = 0;
let health = 60;
let stepIndex = 0;

let deaths = 0;
const maxDeaths = 3;

let level = 1;

const healthFill = document.getElementById("healthFill");
const logBox = document.getElementById("logBox");

function updateLevel(){
  const newLevel = Math.floor(score / 300) + 1;

  if(newLevel > level){
    level = newLevel;

    const lvl = document.getElementById("level");
    lvl.classList.add("levelup");

    setTimeout(() => {
      lvl.classList.remove("levelup");
    }, 1000);

    addLog("🏆 LEVEL UP! You reached Level " + level);

    // refresh buttons when level changes (difficulty scaling)
    renderButtons();
  }

  document.getElementById("level").textContent = level;
}

function loadPatient(){
  const p = patients[currentPatient];
  stepIndex = 0;
  health = 60;

  document.getElementById("patientName").textContent = p.name;
  document.getElementById("animalEmoji").textContent = p.emoji;
  document.getElementById("conditionText").textContent = p.condition;

  renderButtons();
  updateHealth();
  addLog("➡ New patient: " + p.name);
}

function animate(type){
  const animal = document.getElementById("animalEmoji");
  animal.classList.remove("heal","die");

  if(type === "heal") animal.classList.add("heal");
  if(type === "die") animal.classList.add("die");

  setTimeout(() => {
    animal.classList.remove("heal","die");
  }, 900);
}

function updateHealth(){
  if(health <= 0){
    health = 0;
    healthFill.style.width = "0%";

    animate("die");
    setTimeout(() => failPatient(), 800);
    return;
  }

  healthFill.style.width = health + "%";
}

function failPatient(){
  addLog("💀 Patient died");

  score -= 100;
  if(score < 0) score = 0;

  deaths++;

  updateUI();

  if(deaths >= maxDeaths){
    showGameOver("Too many patients were lost.");
    return;
  }

  nextPatient();
}

// 🔥 GAME NEVER ENDS NOW (unless deaths hit 3)
function nextPatient(){
  currentPatient++;

  if(currentPatient >= patients.length){
    currentPatient = 0; // LOOP BACK FOREVER
  }

  loadPatient();
}

function showGameOver(msg){
  document.getElementById("overlay").style.display = "flex";
  document.getElementById("overlayTitle").textContent = "GAME OVER";
  document.getElementById("overlayText").textContent =
    msg + " Final Score: " + score;
}

// 🔥 MAIN CHANGE: wrong move resets patient progress
function perform(action){
  const p = patients[currentPatient];
  const expected = p.steps[stepIndex];

  if(action === expected){
    addLog("✔ Correct: " + action);
    stepIndex++;
    health += 25;
    score += 50;

    animate("heal");
  } else {
    addLog("❌ Wrong step! Restarting treatment...");
    
    // RESET PROGRESS (IMPORTANT CHANGE)
    stepIndex = 0;
    health -= 25;
  }

  updateUI();
  updateHealth();

  if(stepIndex >= p.steps.length){
    addLog("✅ Patient healed!");
    score += 100;
    nextPatient();
  }
}

// 🔥 LEVEL UI + DIFFICULTY SCALING
function updateUI(){
  document.getElementById("score").textContent = score;
  document.getElementById("deaths").textContent = deaths;
  updateLevel();
}

// 🔥 BUTTONS SCALE WITH LEVEL
function renderButtons(){
  let buttons = `
    <button onclick="perform('examine')">Examine</button>
  `;

  if(level >= 1){
    buttons += `<button onclick="perform('medicine')">Medicine</button>`;
  }

  if(level >= 2){
    buttons += `<button onclick="perform('xray')">X-Ray</button>`;
  }

  if(level >= 3){
    buttons += `<button onclick="perform('cast')">Cast</button>`;
  }

  if(level >= 4){
    buttons += `<button onclick="perform('surgery')">Surgery</button>`;
  }

  document.querySelector(".actions").innerHTML = buttons;
}

function restartGame(){
  currentPatient = 0;
  score = 0;
  deaths = 0;
  level = 1;
  health = 60;
  stepIndex = 0;

  document.getElementById("overlay").style.display = "none";
  logBox.innerHTML = "";

  updateUI();
  loadPatient();
}

// INIT
loadPatient();
updateUI();

</script>
